<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Reset your Weekly Report Generator password</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 24px;">
    <table role="presentation" width="100%" style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
        <tr>
            <td>
                <h1 style="font-size: 20px; color: #1f2937; margin-top: 0;">Reset your password</h1>
                <p style="color: #374151; font-size: 14px; line-height: 1.6;">
                    Hi <span th:text="${recipientName}">there</span>, a password reset was requested for your
                    <strong>Weekly Report Generator</strong> account.
                </p>
                <p style="text-align: center; margin: 32px 0;">
                    <a th:href="${resetLink}"
                       style="background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-size: 14px; display: inline-block;">
                        Reset password
                    </a>
                </p>
                <p style="color: #6b7280; font-size: 12px; line-height: 1.6;">
                    Or copy this link into your browser:<br />
                    <a th:href="${resetLink}" th:text="${resetLink}" style="color: #2563eb; word-break: break-all;">link</a>
                </p>
                <p style="color: #6b7280; font-size: 12px;">
                    This link expires on <span th:text="${expiresAtDisplay}">a date</span>.
                    If you didn't request this, you can safely ignore this email -- your password will not change.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
