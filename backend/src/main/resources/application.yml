spring:
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weekly_report_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:didulapostgre123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # Schema + core reference data only. Demo accounts with known passwords live in
    # classpath:db/seed, added on top of this list only by the dev profile -- see
    # application-dev.yml. A production deployment must run with a non-dev profile so it never
    # applies those seed migrations.
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    # 15 minutes -- short on purpose, since the refresh_token cookie (7 days, rotated on every use)
    # is what actually keeps a session alive.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cookie:
    # Off by default for local HTTP dev. Any real deployment serves over HTTPS and MUST set this
    # true -- a cookie marked Secure=false is sent over plain HTTP, which a real deployment never
    # wants for an httpOnly session cookie.
    secure: ${COOKIE_SECURE:false}
  # Base URL of the frontend SPA -- invitation/reset emails link to <frontend-url>/... paths here
  # (never a backend URL), and CORS trusts exactly this one origin (never "*", since credentials
  # are involved).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@weeklyreportgenerator.local}
  security:
    lockout:
      # Failed attempts on one account before it's locked, and how long the lock lasts. Tracked on
      # the user row itself (not in-memory), so it survives a restart.
      max-attempts: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
      duration-minutes: ${LOGIN_LOCKOUT_DURATION_MINUTES:15}
    rate-limit:
      # Coarse per-IP throttle on the two unauthenticated endpoints that can be hammered: login and
      # forgot-password. In-memory, single-instance only -- see RateLimitFilter.
      login-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}
      forgot-password-per-minute: ${FORGOT_PASSWORD_RATE_LIMIT_PER_MINUTE:5}
