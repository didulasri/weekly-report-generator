services:
  postgres:
    image: postgres:17-alpine
    container_name: weekly-report-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-weekly_report_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: weekly-report-mailpit
    ports:
      - "1025:1025" # SMTP -- the dev profile's spring.mail.host/port point here
      - "8025:8025" # Web UI -- open http://localhost:8025 to read invitation/reset emails

volumes:
  postgres_data:
